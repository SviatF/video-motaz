name: PTS Creative Studio · Static QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check creative-tools.js
          node --check emoji-catalog.js
          node --check emoji-labels-uk.js
          node --check creative-library-v2.js
          node --check fullscreen-overlays.js
          node --check uk-localization.js
          node --check motion-keyframes.js
          node --check beat-sync.js
          node --check local-transcription.js
      - name: Build deploy directory
        run: bash build.sh
      - name: Smoke-check output
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/app.js
          test -s dist/creative-tools.js
          test -s dist/emoji-catalog.js
          test -s dist/emoji-labels-uk.js
          test -s dist/creative-library-v2.js
          test -s dist/fullscreen-overlays.js
          test -s dist/uk-localization.js
          test -s dist/motion-keyframes.js
          test -s dist/beat-sync.js
          test -s dist/local-transcription.js
          test -s dist/_headers
          grep -q 'script src="./app.js"' dist/index.html
          grep -q 'id="screen"' dist/index.html
          grep -q 'MediaRecorder' dist/app.js
          grep -q 'creative-tools.js' dist/index.html
          echo 'Cloudflare static output OK'
      - name: Install Playwright (CI-only dev tooling)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser layout and interaction QA
        run: node .github/scripts/layout-check.cjs
      - name: Upload screenshots on layout failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-layout-debug
          path: layout-*.png
          if-no-files-found: ignore
